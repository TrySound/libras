<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="description" content="Browse artists from a Navidrome server" />
    <title>Navidrome Artists</title>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol
        id="icon-back"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol
        id="icon-check"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m5 12 4 4L19 6" />
      </symbol>
      <symbol
        id="icon-chevron-down"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol
        id="icon-download"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3v12m-5-5 5 5 5-5M5 21h14" />
      </symbol>
      <symbol
        id="icon-home"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="m3 11 9-8 9 8v10h-6v-6H9v6H3Z" />
      </symbol>
      <symbol
        id="icon-loading"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
      >
        <g>
          <circle cx="12" cy="12" r="9" opacity="0.25" />
          <path d="M12 3a9 9 0 0 1 9 9" />
          <animateTransform
            attributeName="transform"
            type="rotate"
            from="0 12 12"
            to="360 12 12"
            dur="900ms"
            repeatCount="indefinite"
          />
        </g>
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24" fill="currentColor">
        <circle cx="5" cy="12" r="2" />
        <circle cx="12" cy="12" r="2" />
        <circle cx="19" cy="12" r="2" />
      </symbol>
      <symbol
        id="icon-music"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M9 18V5l11-2v13M9 9l11-2" />
        <circle cx="6" cy="18" r="3" />
        <circle cx="17" cy="16" r="3" />
      </symbol>
      <symbol id="icon-next" viewBox="0 0 24 24" fill="currentColor">
        <path d="M5 5v14l10-7Zm11 0h3v14h-3Z" />
      </symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 4h4v16H6Zm8 0h4v16h-4Z" />
      </symbol>
      <symbol id="icon-play" viewBox="0 0 24 24" fill="currentColor">
        <path d="m7 4 13 8L7 20Z" />
      </symbol>
      <symbol
        id="icon-plus"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
      >
        <path d="M12 5v14M5 12h14" />
      </symbol>
      <symbol id="icon-previous" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19 5v14L9 12Zm-14 0h3v14H5Z" />
      </symbol>
      <symbol id="icon-sound-bars" viewBox="0 0 24 24" fill="currentColor">
        <rect x="3" y="12" width="4" height="9" rx="2">
          <animate attributeName="y" values="12;3;12" dur="650ms" repeatCount="indefinite" />
          <animate attributeName="height" values="9;18;9" dur="650ms" repeatCount="indefinite" />
        </rect>
        <rect x="10" y="6" width="4" height="15" rx="2">
          <animate
            attributeName="y"
            values="6;14;6"
            dur="650ms"
            begin="-420ms"
            repeatCount="indefinite"
          />
          <animate
            attributeName="height"
            values="15;7;15"
            dur="650ms"
            begin="-420ms"
            repeatCount="indefinite"
          />
        </rect>
        <rect x="17" y="10" width="4" height="11" rx="2">
          <animate
            attributeName="y"
            values="10;3;10"
            dur="650ms"
            begin="-210ms"
            repeatCount="indefinite"
          />
          <animate
            attributeName="height"
            values="11;18;11"
            dur="650ms"
            begin="-210ms"
            repeatCount="indefinite"
          />
        </rect>
      </symbol>
      <symbol
        id="icon-settings"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="3" />
        <path
          d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3V2.8h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z"
        />
      </symbol>
    </svg>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
