name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /webapp/
      - run: pnpm --filter @libras/website build
        env:
          DEMO_BASE_PATH: /
      # Secrets are available only to the downloader, never to Vite or frontend code.
      - name: Fetch latest verified demo catalog
        run: node website/download-catalog.mjs --output website/dist/catalog
        env:
          DEMO_EXPORT_URL: ${{ secrets.DEMO_EXPORT_URL }}
          DEMO_MEDIA_PASSWORD: ${{ secrets.DEMO_MEDIA_PASSWORD }}
      - name: Assemble Pages site
        run: |
          mkdir -p pages/webapp
          cp -a dist/. pages/webapp/
          cp -a website/dist/. pages/
      - name: Verify combined Pages artifact
        run: node website/verify-build.mjs --root pages
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
